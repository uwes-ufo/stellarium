name: make_ufo

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:

  launch_ufo:
    runs-on: windows-latest

    steps:

    - shell: bash 
      run: echo "DATE=$(date +%F_%R)" >> $GITHUB_ENV

    - uses: jurplel/install-qt-action@v4
      with:
        version: '6.10.0'
        host: 'windows'
        target: 'desktop'
        cache: true
        arch: 'win64_msvc2022_64'
        modules: 'qtcharts qtimageformats qtlocation qtmultimedia qtpositioning qtscxml qtsensors qtserialbus qtserialport qtvirtualkeyboard qtwebchannel qtwebengine qtwebsockets qtwebview debug_info qt5compat qtquicktimeline qtshadertools'

    - uses: actions/cache@v4
      id: cache
      with:
        path: ./
        key: cache-${{ env.DATE }}
        restore-keys: cache

    - uses: actions/checkout@v6
      with:
        clean: false

    - env: 
        CMAKE_PREFIX_PATH: ${{env.QT_ROOT_DIR}}
      if: steps.cache.outputs.cache-hit == ''
      run: cmake -B build -DSTELLARIUM_RELEASE_BUILD=Off -DENABLE_TESTING=On -DCMAKE_INSTALL_PREFIX=stellarium-bin -DSCM_SHOULD_ENABLE_CONVERTER=OFF -G "Visual Studio 17 2022" -A x64

    - run: cmake --build build -j --target install

    - run: ls stellarium-bin

    - uses: actions/upload-artifact@v4
      with:
         path: stellarium-bin
         retention-days: 2 
