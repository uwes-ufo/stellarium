name: make_ufo

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:

  launch_ufo:
    runs-on: windows-latest

    steps:
    
    - run: echo "CLEAN='false'" >> $GITHUB_ENV
        
    - shell: bash
      env:
        CLEAN: ${{ env.CLEAN }}
      run: |
        echo $CLEAN
        [ $CLEAN = 'false' ] && DATE=$(date +%F) || DATE=$(date +%F_%R)
        echo "DATE=$DATE" >> $GITHUB_ENV

    - uses: jurplel/install-qt-action@v4
      with:
        version: '6.10.0'
        host: 'windows'
        target: 'desktop'
        cache: true
        arch: 'win64_msvc2022_64'
        modules: 'qtcharts qtimageformats qtlocation qtmultimedia qtpositioning qtscxml qtsensors qtserialbus qtserialport qtvirtualkeyboard qtwebchannel qtwebengine qtwebsockets qtwebview debug_info qt5compat qtquicktimeline qtshadertools'

    - uses: actions/cache@v4
      id: cache
      with:
        path: ./
        key: cache-${{ env.DATE }}
        restore-keys: cache

    - uses: actions/checkout@v6
      with:
        clean: ${{ env.CLEAN }}

    - env: 
        CMAKE_PREFIX_PATH: ${{env.QT_ROOT_DIR}}
      if: ${{ env.CLEAN }} == 'true' || steps.cache.outputs.cache-hit == '' 
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=stellarium-bin -DSCM_SHOULD_ENABLE_CONVERTER=OFF -G "Visual Studio 17 2022" -A x64

    - run: cmake --build build --config Release -j --target install

    - uses: actions/upload-artifact@v4
      with:
        name: bin
        path: stellarium-bin/bin
        retention-days: 2

    - uses: actions/upload-artifact@v4
      with:
        name: share
        path: stellarium-bin/share
        retention-days: 2

    - uses: actions/upload-artifact@v4
      with:
        name: qtstuff
        path: stellarium-bin/qtstuff
        retention-days: 2
